org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Gradle/JDK: Android Studio RC ships JDK 25; Kotlin/Gradle fail with cryptic "25.0.2".
# Override per machine or use: flutter config --jdk-dir "C:\\Program Files\\Java\\jdk-17"
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
# If the build fails with only "25.0.2", Gradle is using JDK 25 (Android Studio RC JBR).
android.useAndroidX=true
android.enableJetifier=true
