org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED -Djava.net.preferIPv4Stack=true
# Prefer IPv4: Gradle often fails with "No such host is known" when IPv6 to Google Maven is broken.
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
# Gradle/JDK: Android Studio RC ships JDK 25; Kotlin/Gradle fail with cryptic "25.0.2".
# Override per machine or use: flutter config --jdk-dir "C:\\Program Files\\Java\\jdk-17"
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
# If the build fails with only "25.0.2", Gradle is using JDK 25 (Android Studio RC JBR).
android.useAndroidX=true
android.enableJetifier=true
